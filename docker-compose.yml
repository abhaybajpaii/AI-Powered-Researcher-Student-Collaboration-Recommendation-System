version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-collab_matcher}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collab_user} -d ${POSTGRES_DB:-collab_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - collab_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stu_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-collab_user}:${POSTGRES_PASSWORD:-collab_secure_password}@db:5432/${POSTGRES_DB:-collab_matcher}
      - DATABASE_SYNC_URL=postgresql+psycopg://${POSTGRES_USER:-collab_user}:${POSTGRES_PASSWORD:-collab_secure_password}@db:5432/${POSTGRES_DB:-collab_matcher}
      - SECRET_KEY=${SECRET_KEY:-changethisinproduction_super_secret_jwt_key_at_least_32_chars}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - collab_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stu_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - collab_network

volumes:
  pgdata:
    driver: local

networks:
  collab_network:
    driver: bridge
